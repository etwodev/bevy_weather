name: Release

# Publishes to crates.io when a `v<version>` tag is pushed.
#
#   cargo set-version 0.2.0   # or edit Cargo.toml by hand
#   cargo update -p bevy_weather
#   git commit -am "release 0.2.0"
#   git tag v0.2.0
#   git push && git push --tags
#
# Requires a repository secret named CARGO_REGISTRY_TOKEN, from
# https://crates.io/settings/tokens. Scope it to publish-update (and
# publish-new for the first release) and to this crate alone.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify the package without publishing
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  publish:
    runs-on: ubuntu-latest
    # Deliberately no third-party actions in this job. It is the one place in
    # the repository that holds a registry token, and every action it runs is
    # another codebase that could read it.
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Use the current stable toolchain
        run: rustup update stable && rustup default stable

      - name: Check the tag matches the manifest
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, Cargo.toml says $manifest"
            exit 1
          fi
          echo "publishing $manifest"

      # A version on crates.io cannot be yanked back into existence or
      # replaced, so the tests run here too rather than being trusted from
      # whenever CI last looked at this commit.
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            cargo publish --locked --dry-run
          else
            cargo publish --locked
          fi
