[package]
name = "bevy_weather"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
license = "MIT OR Apache-2.0"
description = "A complete, reusable weather and sky plugin for Bevy: day/night cycle, procedural stars and galaxy, moon phases, volumetric clouds, volumetric fog, rain, snow and thunder."
repository = "https://github.com/etwodev/bevy_weather"
readme = "README.md"
keywords = ["bevy", "weather", "sky", "clouds", "gamedev"]
categories = ["game-development", "rendering"]
exclude = ["/.github", "/assets"]

[features]
default = ["audio"]
# Play thunder claps through `bevy_audio` when an `AudioSource` is supplied.
audio = ["bevy/bevy_audio", "bevy/vorbis"]

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_render",
    "bevy_shader",
    # Light cookies, which is how cloud shadows reach the ground. Pulls in
    # clustered decals; where the GPU cannot do those, the texture is simply
    # never sampled and lighting carries on unshadowed.
    "pbr_light_textures",
] }

[dev-dependencies]
bevy = { version = "0.19.1", features = ["bevy_dev_tools"] }

[[example]]
name = "showcase"
path = "examples/showcase.rs"

[lints.rust]
missing_docs = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
